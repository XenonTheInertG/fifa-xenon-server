<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FIFA 26 Saga</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.7/hls.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500&display=swap');

    :root {
      --green-pitch:  #1a7a3c;
      --green-light:  #25a354;
      --green-dark:   #0d4f24;
      --gold:         #f5c518;
      --white:        #f0f4f0;
      --black:        #0a0f0b;
      --grey:         #1c231e;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--black);
      color: var(--white);
      font-family: 'Barlow', sans-serif;
      overflow-x: hidden;
    }

    /* ── PITCH LINES BACKGROUND ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        repeating-linear-gradient(
          90deg,
          transparent,
          transparent 59px,
          rgba(255,255,255,0.025) 60px
        ),
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 59px,
          rgba(255,255,255,0.025) 60px
        );
      pointer-events: none;
      z-index: 0;
    }

    /* ── HEADER ── */
    header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      background: linear-gradient(135deg, var(--green-dark) 0%, #0a1a0d 100%);
      border-bottom: 3px solid var(--green-pitch);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-ball {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
    }

    .logo-text {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 1.5rem;
      letter-spacing: 0.05em;
      line-height: 1;
    }

    .logo-text span {
      color: var(--gold);
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 7px;
      background: #c0392b;
      color: #fff;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      padding: 5px 12px;
      border-radius: 4px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: #fff;
      border-radius: 50%;
      animation: pulse 1.4s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.7); }
    }

    /* ── MAIN ── */
    main {
      position: relative;
      z-index: 5;
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 20px 48px;
    }

    /* ── EVENT LABEL ── */
    .event-label {
      text-align: center;
      margin-bottom: 18px;
    }

    .event-label h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: clamp(1.8rem, 5vw, 3rem);
      letter-spacing: 0.03em;
      text-transform: uppercase;
      line-height: 1;
    }

    .event-label h1 em {
      color: var(--gold);
      font-style: normal;
    }

    .event-label p {
      margin-top: 6px;
      font-size: 0.85rem;
      color: #8aac90;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* ── VIDEO WRAPPER ── */
    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid var(--green-dark);
      box-shadow: 0 0 40px rgba(26, 122, 60, 0.25);
    }

    #player {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ── OVERLAY STATES ── */
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: rgba(0,0,0,0.78);
      transition: opacity 0.4s;
    }

    .overlay.hidden { opacity: 0; pointer-events: none; }

    .overlay-icon {
      font-size: 3.5rem;
      line-height: 1;
    }

    .overlay p {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.1rem;
      letter-spacing: 0.05em;
      color: #cde8d1;
      text-align: center;
      max-width: 280px;
    }

    .btn-play {
      background: var(--green-pitch);
      color: #fff;
      border: none;
      padding: 11px 28px;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-play:hover { background: var(--green-light); }

    /* ── SPINNER ── */
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255,255,255,0.15);
      border-top-color: var(--green-light);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── STATUS BAR ── */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      padding: 8px 14px;
      background: var(--grey);
      border-radius: 6px;
      font-size: 0.78rem;
      color: #7a9980;
      font-family: 'Barlow Condensed', sans-serif;
      letter-spacing: 0.05em;
    }

    #status-msg { color: #9ecfa7; }

    /* ── FIELD DIVIDER ── */
    .field-divider {
      margin: 32px 0 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      opacity: 0.35;
    }

    .field-divider::before,
    .field-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--green-pitch);
    }

    .field-divider span {
      font-size: 1.2rem;
    }

    /* ── INFO CARDS ── */
    .info-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }

    .info-card {
      background: var(--grey);
      border: 1px solid #1e2e21;
      border-radius: 8px;
      padding: 16px 18px;
      text-align: center;
    }

    .info-card .label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #5a7a60;
      margin-bottom: 6px;
    }

    .info-card .value {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--gold);
    }

    /* ── FOOTER ── */
    footer {
      position: relative;
      z-index: 5;
      text-align: center;
      padding: 18px;
      font-size: 0.75rem;
      color: #3a5a3e;
      letter-spacing: 0.07em;
    }

    footer strong { color: #6a9a70; }

    @media (max-width: 480px) {
      header { padding: 10px 14px; }
      .logo-text { font-size: 1.2rem; }
      main { padding: 16px 12px 36px; }
    }
  </style>
</head>
<body>

<!-- ── HEADER ── -->
<header>
  <div class="logo">
    <!-- SVG football -->
    <svg class="logo-ball" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="18" cy="18" r="17" fill="#fff" stroke="#222" stroke-width="1.5"/>
      <polygon points="18,6 22,13 28,13 24,18 26,25 18,21 10,25 12,18 8,13 14,13" fill="#1a1a1a"/>
      <circle cx="18" cy="18" r="4" fill="#1a1a1a"/>
    </svg>
    <div class="logo-text">FIFA 26 <span>SAGA</span></div>
  </div>
  <div class="live-badge">
    <span class="live-dot"></span>
    LIVE
  </div>
</header>

<!-- ── MAIN ── -->
<main>
  <div class="event-label">
    <h1>FIFA 26 <em>Saga</em></h1>
    <p>Live Broadcast · World Cup 2026</p>
  </div>

  <!-- VIDEO PLAYER -->
  <div class="video-wrapper">
    <video id="player" controls playsinline></video>

    <!-- LOADING OVERLAY -->
    <div class="overlay" id="loading-overlay">
      <div class="spinner"></div>
      <p>Connecting to live stream…</p>
    </div>

    <!-- ERROR OVERLAY -->
    <div class="overlay hidden" id="error-overlay">
      <div class="overlay-icon">⚠️</div>
      <p>Stream unavailable. The broadcast may not have started yet.</p>
      <button class="btn-play" onclick="retryStream()">Retry</button>
    </div>
  </div>

  <!-- STATUS BAR -->
  <div class="status-bar">
    <span id="status-msg">Initialising player…</span>
    <span id="quality-label">HLS</span>
  </div>

  <!-- DIVIDER -->
  <div class="field-divider"><span>⚽</span></div>

  <!-- INFO CARDS -->
  <div class="info-row">
    <div class="info-card">
      <div class="label">Stream</div>
      <div class="value">FIFA 26 Saga</div>
    </div>
    <div class="info-card">
      <div class="label">Event</div>
      <div class="value">FIFA WC 2026</div>
    </div>
    <div class="info-card">
      <div class="label">Format</div>
      <div class="value">HLS Stream</div>
    </div>
    <div class="info-card">
      <div class="label">Quality</div>
      <div class="value" id="res-label">Auto</div>
    </div>
  </div>
</main>

<!-- ── FOOTER ── -->
<footer>
  Built with ⚽ &nbsp;|&nbsp; <strong>Credit: Mahin Ahmed</strong>
</footer>

<script>
  const STREAM_URL = 'http://103.151.61.12/T-Sports.kutta/video.m3u8';

  const video          = document.getElementById('player');
  const loadingOverlay = document.getElementById('loading-overlay');
  const errorOverlay   = document.getElementById('error-overlay');
  const statusMsg      = document.getElementById('status-msg');
  const qualityLabel   = document.getElementById('quality-label');
  const resLabel       = document.getElementById('res-label');

  let hls = null;

  function showOverlay(which) {
    loadingOverlay.classList.toggle('hidden', which !== 'loading');
    errorOverlay.classList.toggle('hidden', which !== 'error');
    if (which === 'none') {
      loadingOverlay.classList.add('hidden');
      errorOverlay.classList.add('hidden');
    }
  }

  function initPlayer() {
    if (hls) { hls.destroy(); hls = null; }

    showOverlay('loading');
    statusMsg.textContent = 'Connecting to stream…';

    if (Hls.isSupported()) {
      hls = new Hls({
        lowLatencyMode: true,
        backBufferLength: 30,
      });

      hls.loadSource(STREAM_URL);
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        statusMsg.textContent = 'Stream ready · playing';
        showOverlay('none');
        video.play().catch(() => {});
      });

      hls.on(Hls.Events.LEVEL_UPDATED, (_, data) => {
        const lvl = hls.levels[data.level];
        if (lvl && lvl.height) {
          resLabel.textContent = lvl.height + 'p';
          qualityLabel.textContent = 'HLS · ' + lvl.height + 'p';
        }
      });

      hls.on(Hls.Events.ERROR, (_, data) => {
        if (data.fatal) {
          statusMsg.textContent = 'Stream error: ' + data.type;
          showOverlay('error');
        }
      });

    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      // Safari native HLS
      video.src = STREAM_URL;
      video.addEventListener('loadedmetadata', () => {
        showOverlay('none');
        statusMsg.textContent = 'Playing via native HLS';
        video.play().catch(() => {});
      }, { once: true });
      video.addEventListener('error', () => {
        showOverlay('error');
        statusMsg.textContent = 'Native HLS error';
      }, { once: true });
    } else {
      statusMsg.textContent = 'HLS not supported in this browser.';
      showOverlay('error');
    }
  }

  function retryStream() {
    initPlayer();
  }

  initPlayer();
</script>
</body>
</html>
